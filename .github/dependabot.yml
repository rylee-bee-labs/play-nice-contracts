# Estate dependabot template (agent-platform docs/ops/dependabot.md, 2026-10-27):
# - minor + patch arrive as ONE grouped PR per ecosystem; a major arrives as its own PR;
# - security updates are grouped too, are not delayed by the cooldown, and open as soon as an advisory
#   lands -- the schedule below only paces version updates;
# - a 3-day cooldown (14 for majors, where the ecosystem supports it) lets a bad release get yanked first;
# - docs/archive/** is frozen history and never gets a bump;
# - monthly (not a live service): Dependabot runs it on the 1st of the month;
#   ecosystems in one repo share that run on purpose: one repo, one CI morning.
#
# From the previous file (repo-specific, still true unless the template above says otherwise):
# Dependabot configuration for Play Nice Contracts
#
# The library is stdlib-only at runtime. The test-only tools
# (pytest, pytest-xdist, pyyaml) are declared in pyproject.toml's
# `dev` extra with lower bounds only, not pinned, and CI installs
# them with `pip install`. Dependabot tracks only GitHub Actions
# here (including the ci-harness pin in secret-scan.yml).
#
# If the test tools are ever pinned, add a pip updater with the
# same grouping style as the GitHub Actions updater below.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "05:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
    exclude-paths:
      - "docs/archive/**"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
    ignore:  # ci-harness pins belong to bin/harness-repin; the rest carried over from the previous file
      - {dependency-name: rylee-bee-labs/ci-harness*}
