name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Commit identity guard
        run: |
          # Fail closed on personal identifiers in commit metadata.
          # Allowed: GitHub noreply addresses and RFC 2606 .invalid
          # synthetic identities. GitHub-generated merge/squash wrappers
          # (committer exactly noreply@github.com) are skipped: the
          # original author commits already passed this check in the
          # pull_request event, and wrapper authors come from account
          # settings, not local git config. Machine hostnames, tunnel
          # domains, and raw mailbox addresses must never enter raw
          # commits in public history.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          RANGE="${BASE:+$BASE..$HEAD}"
          [ -n "$RANGE" ] || RANGE="HEAD~1..HEAD"
          BAD=$(git log --format='%ae %ce' $RANGE | awk \
                  '$2=="noreply@github.com"{next} {print $1; print $2}' | sort -u \
                | grep -Ev '@users\.noreply\.github\.com$|@[A-Za-z0-9.-]*[.]invalid$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::commit metadata contains disallowed identity emails:"
            echo "$BAD"
            echo "Set a scrubbed identity: git config user.email <id>+<user>@users.noreply.github.com"
            exit 1
          fi
          echo "commit identity guard: all emails noreply/.invalid"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: pip install pytest pytest-xdist

      - name: Validate CI workflow YAML parses and defines the expected job
        run: |
          pip install pyyaml
          python3 - <<'PYEOF'
          import sys
          try:
              import yaml
          except ImportError:
              print("pyyaml unavailable; skipping strict parse (non-fatal)")
              sys.exit(0)
          with open(".github/workflows/ci.yml") as f:
              doc = yaml.safe_load(f)
          assert isinstance(doc, dict), "workflow root must be a mapping"
          jobs = doc.get("jobs") or {}
          assert "library" in jobs, "expected job 'library' missing"
          assert jobs["library"].get("name", "library") == "library", "protected check name must be library"
          steps = jobs["library"].get("steps") or []
          names = [s.get("name") or s.get("uses") or "?" for s in steps]
          for expected in ["Validate library", "Full test suite",
                           "Secret / private-material scan (library surfaces)"]:
              assert expected in names, f"expected step {expected!r} missing"
          print("workflow YAML valid; job and steps present:", names)
          PYEOF

      - name: Validate library
        # Contract changes (version bump, receipt rotation, changelog bullet)
        # are judged against the PR's base commit; on a push, against the
        # merge-base with origin/main.
        env:
          PLAY_NICE_BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/contractctl/contractctl.py validate

      - name: Generated files are current
        # lock (regenerated twice, byte-compared), index columns, badge,
        # AGENTS block; a stale file is named with its regenerate command
        run: ./tools/check-generated.sh

      - name: Full test suite
        run: python3 -m pytest tests/ -q -n auto

      - name: Secret / private-material scan (library surfaces)
        run: python3 tools/contractctl/contractctl.py scan

      - name: Play-Nice self-check (the README badge reflects this result)
        run: python3 tools/playnice/playnice.py check .

  # One stable check name for the merge rule. The matrix above reports as
  # "library (3.10)" etc., never plain "library", so the ruleset waits on this
  # job instead. Add or drop Python versions freely; nothing else changes.
  library-gate:
    name: library
    needs: library
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Python version passed
        run: |
          test "${{ needs.library.result }}" = "success" || {
            echo "library matrix result: ${{ needs.library.result }}"; exit 1; }
