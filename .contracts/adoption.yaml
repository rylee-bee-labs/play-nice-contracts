# Adoption manifest — play-nice-contracts consumes its own library.
# The contract gate is dogfooded here: substantial mutating work in this
# repo runs freshness -> resolve -> read -> attest -> commit like any
# consumer. `source.self: true` marks this as the library adopting itself:
# a commit cannot pin its own SHA, so the pin only has to be a reviewed
# commit already in main's history (checked by ancestry), not HEAD. It
# never needs bumping after a merge. Full rulebook: docs/MAINTAINING.md.
schema: play-nice/adoption-v1
project: play-nice-contracts
source:
  repository: rylee-bee-labs/play-nice-contracts
  revision: 2969685e38458a65e29bc8f63f3b38a3ab4a4556
  self: true

freshness:
  policy: require-current
  ref: main
  update: automatic

always:
  - truth-and-evidence
  - ask-for-help
  - recovery-and-history
  - status-and-state
  - testing-and-evidence
  - ownership-and-portability

triggers:
  agent:
    - agent-behavior
    - bounded-work
    - handoff-and-continuity
    - contract-proof
  governance:
    - versions-and-discovery
    - secrets-and-data
    - public-and-private
  engineering:
    - handoff-and-continuity
    - search-before-building
    - git-and-worktrees
  human-facing:
    - plain-language
    - depth-on-demand

notes: >-
  Self-adoption keeps the library honest: the floors that govern
  consumers also govern edits to contracts, schemas, tooling, and docs
  here. Licensing and identity changes additionally follow CODEOWNERS
  and TRADEMARKS.md.
